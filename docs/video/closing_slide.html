<!doctype html>
<!--
  Closing slide for the demo video ("That's Apigee as the AI and tools gateway ...").
  Edit TITLE, SUBTITLE, GROUPS or FOOTER below; the recorder shows this page full screen during
  the closing line, so no slide export is needed. Open it in a browser at 16:9 to preview.
  Icons are inline Material icon paths (24x24 viewBox), so the page works offline.
  Sizes are px on purpose: the 1600x900 stage is scaled as a whole to fit the window.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apigee provides unified governance across models and tools</title>
<style>
  :root { --ink: #202124; --muted: #5f6368; --bg: #f8f9fb; --card: #fff; --line: #dadce0; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Google Sans', 'Product Sans', Roboto, 'Helvetica Neue', Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  /* Fixed 1600x900 stage scaled to the window, so layout is identical at any resolution. */
  .stage {
    width: 1600px; height: 900px; padding: 40px 64px 34px; transform-origin: center; flex: none;
    display: flex; flex-direction: column;
  }
  h1 { font-size: 50px; font-weight: 500; letter-spacing: -0.5px; line-height: 1.1; text-wrap: balance; }
  .subtitle { font-size: 27px; font-weight: 400; color: var(--muted); margin-top: 12px; line-height: 1.3; text-wrap: balance; }
  /* Groups sit side by side on a 5-column track and fill the height between subtitle and footer. */
  /* One header line across the slide: first group's label on the left, last group's on the right. */
  .span-label {
    display: flex; align-items: center; gap: 16px; margin-top: 36px; margin-bottom: 14px;
    font-size: 21px; font-weight: 600; letter-spacing: 0.4px; color: var(--ink);
  }
  .span-label::before { content: ''; order: 1; flex: 1; height: 1px; background: var(--line); }
  .span-label span:last-child { order: 2; }
  .groups {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: repeat(5, 1fr); column-gap: 30px;
  }
  .group { grid-column: span var(--cols); display: flex; flex-direction: column; min-height: 0; }
  .grid {
    flex: 1; min-height: 0; display: grid; gap: 18px;
    grid-template-columns: repeat(var(--cols), 1fr); grid-auto-rows: 1fr;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    border-top: 6px solid var(--c); padding: 22px 22px 20px;
    box-shadow: 0 1px 2px rgba(60, 64, 67, .08);
  }
  .card-head { display: flex; align-items: center; gap: 10px; }
  .card svg { width: 32px; height: 32px; fill: var(--c); flex: none; }
  .card h3 { font-size: 25px; font-weight: 600; line-height: 1.15; }
  .card p { font-size: 21px; line-height: 1.38; color: var(--muted); margin-top: 14px; text-wrap: pretty; }
  .footer {
    margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line);
    display: flex; justify-content: center; align-items: center; gap: 56px;
    font-size: 19px; color: var(--muted); white-space: nowrap;
  }
  .footer span::before { content: '✓'; color: #34a853; font-weight: 700; margin-right: 10px; }
  .footer span:first-child {
    color: var(--ink); font-weight: 600; background: #e8f0fe; border: 1px solid #aecbfa;
    border-radius: 999px; padding: 7px 18px;
  }
  .footer span:first-child::before { content: '☁'; color: #1a73e8; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <h1 id="title"></h1>
  <p class="subtitle" id="subtitle"></p>
  <div class="span-label" id="span-label"></div>
  <div class="groups" id="groups"></div>
  <div class="footer" id="footer"></div>
</div>
<script>
  const TITLE = 'Apigee provides unified governance across models and tools';
  const SUBTITLE = 'Same agent, same prompts. Apigee decides what it may call and spend, and records every call.';
  const ICON = {
    person: 'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z',
    gavel: 'M1 21h12v2H1zM5.245 8.07l2.83-2.827 14.14 14.142-2.828 2.828zM12.317 1l5.657 5.656-2.83 2.83-5.654-5.66zM3.825 9.485l5.657 5.657-2.828 2.828-5.657-5.657z',
    shield: 'M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z',
    speed: 'M20.38 8.57l-1.23 1.85a8 8 0 0 1-.22 7.58H5.07A8 8 0 0 1 15.58 6.85l1.85-1.23A10 10 0 0 0 3.35 19a2 2 0 0 0 1.72 1h13.85a2 2 0 0 0 1.74-1 10 10 0 0 0-.27-10.44zm-9.79 6.84a2 2 0 0 0 2.83 0l5.66-8.49-8.49 5.66a2 2 0 0 0 0 2.83z',
    split: 'M14 4l2.29 2.29-2.88 2.88 1.42 1.42 2.88-2.88L20 10V4zm-4 0H4v6l2.29-2.29 4.71 4.7V20h2v-8.41l-5.29-5.3z',
    bolt: 'M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C12.96 17.55 11 21 11 21z',
    wallet: 'M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z',
    server: 'M20 13H4c-.55 0-1 .45-1 1v6c0 .55.45 1 1 1h16c.55 0 1-.45 1-1v-6c0-.55-.45-1-1-1zM7 19c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM20 3H4c-.55 0-1 .45-1 1v6c0 .55.45 1 1 1h16c.55 0 1-.45 1-1V4c0-.55-.45-1-1-1zM7 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z',
    dashboard: 'M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z',
    audit: 'M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z',
  };

  // Groups read left to right: AI Gateway, what both gateways share, then MCP Gateway.
  // The header line shows the first and last group labels at either end. `cols` is the
  // group's width on the 5-column track (counts must add up to 5); cards fill it row by row.
  // Keep the text at capability level (what customers get), not how the demo implements it.
  const GROUPS = [
    {
      label: 'AI Gateway', cols: 1,
      cards: [
        { icon: 'split', color: '#e8710a', title: 'Model routing', text: 'Send each request to the right model across providers, balancing cost and quality.' },
        { icon: 'shield', color: '#34a853', title: 'AI security', text: 'Screen prompts and responses for attacks and sensitive data.' },
      ],
    },
    {
      label: '', cols: 3, // shared by both gateways
      cards: [
        { icon: 'person', color: '#4285f4', title: 'Access control', text: 'Decide which models and tools each user, team or agent can use.' },
        { icon: 'speed', color: '#ea4335', title: 'Usage limits', text: 'Cap token use and call rates per user, team, model and tool.' },
        { icon: 'bolt', color: '#12b5cb', title: 'Caching', text: 'Reuse responses for similar prompts and repeat tool calls to cut latency and cost.' },
        { icon: 'wallet', color: '#f9ab00', title: 'Cost control', text: 'Track spend per user and team, enforce budgets, and charge back or monetize usage.' },
        { icon: 'audit', color: '#5f6368', title: 'Audit logs', text: 'Record every LLM, tool and API call, allowed, blocked or failed, with optional PII masking.' },
        { icon: 'dashboard', color: '#1a73e8', title: 'Analytics', text: 'See consumption across models and tools, built in or in the dashboards you already use.' },
      ],
    },
    {
      label: 'MCP Gateway', cols: 1,
      cards: [
        { icon: 'server', color: '#795548', title: 'Native MCP', text: 'Turn existing APIs into governed MCP tools, with no new infrastructure.' },
        { icon: 'gavel', color: '#a142f4', title: 'Tool policies', text: 'Enforce business rules on every tool call, whatever the model decides.' },
      ],
    },
  ];
  // The first item is highlighted.
  const FOOTER = [
    'Deploy anywhere: Google Cloud, any cloud or on-prem (Apigee hybrid)',
    'Any model provider',
    'Agents connect with a config change, no rewrite',
  ];

  document.getElementById('title').textContent = TITLE;
  document.getElementById('subtitle').textContent = SUBTITLE;
  const spanLabel = document.getElementById('span-label');
  for (const text of [GROUPS[0].label, GROUPS.at(-1).label]) {
    const s = document.createElement('span');
    s.textContent = text;
    spanLabel.appendChild(s);
  }
  const groups = document.getElementById('groups');
  for (const g of GROUPS) {
    const group = document.createElement('section');
    group.className = 'group';
    group.style.setProperty('--cols', g.cols);
    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const c of g.cards) {
      const el = document.createElement('div');
      el.className = 'card';
      el.style.setProperty('--c', c.color);
      el.innerHTML = `<div class="card-head"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[c.icon]}"/></svg><h3></h3></div><p></p>`;
      el.querySelector('h3').textContent = c.title;
      el.querySelector('p').textContent = c.text;
      grid.appendChild(el);
    }
    group.append(grid);
    groups.appendChild(group);
  }
  const footer = document.getElementById('footer');
  for (const f of FOOTER) {
    const s = document.createElement('span');
    s.textContent = f;
    footer.appendChild(s);
  }
  const fit = () => {
    const s = Math.min(innerWidth / 1600, innerHeight / 900);
    document.getElementById('stage').style.transform = `scale(${s})`;
  };
  addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
